<!doctype html>
<html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>Azkar o Duain</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Noto+Nastaliq+Urdu:wght@400;600&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: one night-prayer scroll. A single centred column of lantern-lit cards; each card pins its read-count badge at the top corner, Arabic large, Urdu translation below with its own badge. */
:root {
  --bg: #0a1a22;
  --surface: #102a33;
  --surface-2: #143540;
  --line: #24505e;
  --fg: #e9f0ea;
  --muted: #9fb9b6;
  --gold: #e2b65c;
  --on-gold: #1b1403;
  --done: #62c2a1;
  --font-ar: "Amiri Quran", "Noto Naskh Arabic", "Traditional Arabic", serif;
  --font-ur: "Noto Nastaliq Urdu", "Noto Naskh Arabic", serif;
  --font-ui: "Reem Kufi", "Noto Kufi Arabic", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e9f1ee;
    --surface: #ffffff;
    --surface-2: #f2f8f6;
    --line: #bfd5d0;
    --fg: #0e2a31;
    --muted: #48676a;
    --gold: #86590a;
    --on-gold: #ffffff;
    --done: #12795a;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e9f1ee;
  --surface: #ffffff;
  --surface-2: #f2f8f6;
  --line: #bfd5d0;
  --fg: #0e2a31;
  --muted: #48676a;
  --gold: #86590a;
  --on-gold: #ffffff;
  --done: #12795a;
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ur);
  padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}
main { max-width: 720px; margin-inline: auto; }

header { text-align: center; padding-block: 36px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
header svg { color: var(--gold); }
h1 { font-family: var(--font-ar); font-weight: 400; font-size: clamp(2.4rem, 10vw, 3.6rem); line-height: 1.5; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); font-size: 1rem; line-height: 2.2; max-width: 34ch; text-wrap: balance; }

.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 18px; margin-top: 6px; color: var(--muted); font-size: .92rem; line-height: 2; }
.legend span { display: inline-flex; align-items: center; gap: 8px; }

.badge {
  font-family: var(--font-ui);
  font-weight: 700;
  font-size: .95rem;
  letter-spacing: .02em;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  padding: 7px 12px 6px;
  border-radius: 999px;
  white-space: nowrap;
  direction: rtl;
  border: 1.5px solid var(--gold);
  color: var(--gold);
}
.badge.ar { background: var(--gold); color: var(--on-gold); }

.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  padding-block: 10px 12px;
  display: flex; align-items: center; gap: 14px;
  border-bottom: 1px solid var(--line);
}
.track { flex: 1; min-width: 0; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--gold); transition: width .3s ease; }
.count { font-family: var(--font-ui); font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; direction: ltr; white-space: nowrap; }
.reset { font-family: var(--font-ur); font-size: .85rem; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; line-height: 2; }

section { padding-top: 34px; }
.sec-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.sec-head h2 { font-family: var(--font-ui); font-weight: 700; font-size: 1.35rem; margin: 0; color: var(--gold); white-space: nowrap; }
.sec-head::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.sec-sub { margin: -6px 0 14px; color: var(--muted); font-size: .95rem; line-height: 2.2; }
.bismillah { font-family: var(--font-ar); font-size: clamp(1.6rem, 6vw, 2.2rem); text-align: center; color: var(--gold); margin: 4px 0 18px; line-height: 2; }

.cards { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card.done { border-color: var(--done); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.name { font-family: var(--font-ui); font-weight: 500; font-size: 1.05rem; margin: 0; }
.ref { color: var(--muted); font-size: .85rem; line-height: 2; }
.ar-text { font-family: var(--font-ar); font-size: clamp(1.55rem, 5.6vw, 2.2rem); line-height: 2.3; margin: 0; text-align: center; text-wrap: pretty; overflow-wrap: anywhere; }
.ar-text.small { font-size: clamp(1.3rem, 4.6vw, 1.8rem); color: var(--muted); }
.tr { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.tr-head { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .85rem; }
.tr p { margin: 0; font-size: 1.05rem; line-height: 2.5; }
.again { display: flex; flex-direction: column; gap: 6px; border-top: 1px dashed var(--line); padding-top: 12px; }
.again .lbl { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .9rem; }
.note-text { margin: 0; font-size: 1.08rem; line-height: 2.5; }

.tick { align-self: flex-start; font-family: var(--font-ur); font-size: .95rem; line-height: 2; background: none; color: var(--fg); border: 1.5px solid var(--line); border-radius: 999px; padding: 2px 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.tick::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--muted); }
.card.done .tick { border-color: var(--done); color: var(--done); }
.card.done .tick::before { background: var(--done); border-color: var(--done); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

footer { text-align: center; color: var(--muted); padding-top: 40px; font-size: .95rem; line-height: 2.4; }
@media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>

<main dir="rtl" lang="ur">
  <header>
    <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="12" y="12" width="40" height="40"/><rect x="12" y="12" width="40" height="40" transform="rotate(45 32 32)"/><circle cx="32" cy="32" r="9"/></g></svg>
    <h1>اَذْکار و دُعائیں</h1>
    <p class="lede">ہر عمل کے ساتھ لکھا ہے کہ عربی کتنی بار پڑھنی ہے اور ترجمہ کتنی بار۔</p>
    <div class="legend">
      <span><b class="badge ar">×11</b> عربی اتنی بار پڑھیں</span>
      <span><b class="badge">×3</b> ترجمہ اتنی بار پڑھیں</span>
    </div>
  </header>

  <div class="bar">
    <div class="track"><div class="fill" id="fill"></div></div>
    <span class="count" id="count">0 / 0</span>
    <button class="reset" id="reset" type="button">دوبارہ شروع</button>
  </div>

  <div id="root"></div>

  <footer>اللہ ہماری دعاؤں کو قبول فرمائے۔ آمین</footer>
</main>

<script>
var SECTIONS = [
{
  title: "اذکار",
  items: [
    { name: "درودِ ابراہیمی", c: 11, t: 1,
      ar: "اَللّٰهُمَّ صَلِّ عَلٰى مُحَمَّدٍ وَّعَلٰى اٰلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلٰى اِبْرَاهِيْمَ وَعَلٰى اٰلِ اِبْرَاهِيْمَ اِنَّكَ حَمِيْدٌ مَّجِيْدٌ ۝ اَللّٰهُمَّ بَارِكْ عَلٰى مُحَمَّدٍ وَّعَلٰى اٰلِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلٰى اِبْرَاهِيْمَ وَعَلٰى اٰلِ اِبْرَاهِيْمَ اِنَّكَ حَمِيْدٌ مَّجِيْدٌ",

var KEY = "azkar-done-v1";
var done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { done = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} }

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function badge(n, cls) { return '<b class="badge ' + (cls || "") + '">×' + n + '</b>'; }

var total = 0;
var html = "";
SECTIONS.forEach(function (sec, si) {
  html += '<section><div class="sec-head"><h2>' + esc(sec.title) + '</h2></div>';
  if (sec.bismillah) html += '<p class="bismillah">' + sec.bismillah + '</p>';
  html += '<div class="cards">';
  sec.items.forEach(function (it, ii) {
    var id = si + "-" + ii;
    total++;
    html += '<article class="card" data-id="' + id + '">';
    html += '<div class="top"><div><h3 class="name">' + esc(it.name) + '</h3>' + (it.ref ? '<div class="ref">' + esc(it.ref) + '</div>' : '') + '</div>' + (it.c ? badge(it.c, "ar") : '') + '</div>';
    if (it.note) html += '<p class="note-text">' + esc(it.note) + '</p>';
    if (it.ar) html += '<p class="ar-text">' + it.ar + '</p>';
    if (it.ur) html += '<div class="tr"><div class="tr-head">ترجمہ ' + badge(it.t) + '</div><p>' + esc(it.ur) + '</p></div>';
    if (it.again) html += '<div class="again"><div class="lbl">پھر یہی دعا ' + badge(it.again, "ar") + '</div><p class="ar-text small">' + it.ar + '</p></div>';
    html += '<button class="tick" type="button" aria-pressed="false">پڑھ لیا</button>';
    html += '</article>';
  });
  html += '</div></section>';
});
document.getElementById("root").innerHTML = html;

var fill = document.getElementById("fill");
var countEl = document.getElementById("count");
function paint() {
  var n = 0;
  document.querySelectorAll(".card").forEach(function (c) {
    var on = !!done[c.getAttribute("data-id")];
    c.classList.toggle("done", on);
    c.querySelector(".tick").setAttribute("aria-pressed", on ? "true" : "false");
    if (on) n++;
  });
  fill.style.width = (total ? (n / total) * 100 : 0) + "%";
  countEl.textContent = n + " / " + total;
}
document.getElementById("root").addEventListener("click", function (e) {
  var btn = e.target.closest(".tick");
  if (!btn) return;
  var id = btn.closest(".card").getAttribute("data-id");
  if (done[id]) delete done[id]; else done[id] = 1;
  save(); paint();
});
var rb = document.getElementById("reset"), rt = null;
rb.addEventListener("click", function () {
  if (rt) { clearTimeout(rt); rt = null; done = {}; save(); paint(); rb.textContent = "دوبارہ شروع"; return; }
  rb.textContent = "پکا؟ دوبارہ دبائیں";
  rt = setTimeout(function () { rt = null; rb.textContent = "دوبارہ شروع"; }, 3000);
});
paint();
</script>
